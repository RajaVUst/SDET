name: UI

on:
  push:
    branches: [304525-chandana_finalcapstone]
  pull_request:
    branches: [304525-chandana_finalcapstone]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    working-directory: ./UI_Final_Capstone
    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://chess-agent-83252463.figma.site/' }}
      DEMO_USER_ID: ${{ secrets.DEMO_USER_ID || 'demo-login-user-003' }}
      HEADLESS: 'true'
      TIMEOUT: '30000'
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./UI_Final_Capstone/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          mkdir -p reports/allure-results reports/allure-report
          ALLURE_RESULTS_DIR=reports/allure-results npx playwright test --reporter=line,html,allure-playwright
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p reports/allure-results reports/allure-report
          if [ -d reports/allure-results ] && [ -n "$(find reports/allure-results -mindepth 1 -maxdepth 1 -type f 2>/dev/null)" ]; then
            npx allure generate reports/allure-results --clean -o reports/allure-report || true
          fi
        shell: bash

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            UI_Final_Capstone/playwright-report/
            UI_Final_Capstone/test-results/
            UI_Final_Capstone/reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail job if tests failed
        if: always()
        run: |
          if [ -f test-results/.last-run.json ]; then
            node -e "const fs=require('fs'); const p='test-results/.last-run.json'; if (fs.existsSync(p)) { const data=JSON.parse(fs.readFileSync(p,'utf8')); if (data.stats && (data.stats.failed>0 || data.stats.skipped>0 && data.stats.total===0)) process.exit(1); }"
          fi
        shell: bash
