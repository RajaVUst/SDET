name: Playwright Tests
on:
  push:
    branches: [ main, Sankaran_Final_Assessment]
  pull_request:
    branches: [ main]
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      Sankaran_UI_Base_URL: ${{ secrets.Sankaran_UI_Base_URL }}
      GUEST_NAME: ${{ secrets.GUEST_NAME }}
      GUEST_EMAIL: ${{ secrets.GUEST_EMAIL }}
      GUEST_PHONE: ${{ secrets.GUEST_PHONE }}
      GUEST_STREET: ${{ secrets.GUEST_STREET }}
      GUEST_CITY: ${{ secrets.GUEST_CITY }}
      GUEST_STATE: ${{ secrets.GUEST_STATE }}
      GUEST_ZIP: ${{ secrets.GUEST_ZIP }}
      GUEST_COUNTRY: ${{ secrets.GUEST_COUNTRY }}
      PAYMENT_CARD_NUMBER: ${{ secrets.PAYMENT_CARD_NUMBER }}
      PAYMENT_CARD_EXPIRY: ${{ secrets.PAYMENT_CARD_EXPIRY }}
      PAYMENT_CVV: ${{ secrets.PAYMENT_CVV }}
      PAYMENT_DECLINED_CARD_NUMBER: ${{ secrets.PAYMENT_DECLINED_CARD_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: FinalCapstone_UIAutomation

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: FinalCapstone_UIAutomation

      - name: Run UI tests
        run: npx playwright test
        working-directory: FinalCapstone_UIAutomation

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: CapStone_UI_Final/test-results/