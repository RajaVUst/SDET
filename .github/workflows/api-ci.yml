name: Final Assessment API CI

on:
  push:
    branches:
      - capstone-307389-rishika

  workflow_dispatch:

jobs:
  api-tests:
    name: Rest Assured API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-automation

    env:
      BASE_URL: ${{ secrets.RISHIKA_API_BASE_URL }}
      USERNAME: ${{ secrets.RISHIKA_USER }}
      PASSWORD: ${{ secrets.RISHIKA_API_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Build Project
        run: mvn clean compile

      - name: Verify Environment Variables
        run: |
          echo "BASE_URL=$BASE_URL"
          echo "USERNAME=$USERNAME"
          echo "PASSWORD length=${#PASSWORD}"

      - name: Run API Tests
        run: mvn test

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api-automation/target/surefire-reports