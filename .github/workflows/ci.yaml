name: Final Assessment UI CI

on:
  push:
    branches:
      - 307473-premchand-cp

  pull_request:
    branches:
      - main

jobs:
    api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: API-Assessment

    env:
      apiUrl: ${{ secrets.PREM_API_URL }}

      API_USERNAME: ${{ secrets.PREM_API_USERNAME }}
      PASSWORD: ${{ secrets.PREM_PASSWORD }}


    steps:

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: API-DB Capstone/allure-results


    ui-tests:
      name: Playwright UI Tests
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: Playwright

      env:
        BASE_URL: ${{ secrets.PREM_BASE_URL }}

        CARD_NAME: ${{ secrets.PREM_CARD_NAME }}
        CARD_NO: ${{ secrets.PREM_CARD_NO }}
        EXPIRY: ${{ secrets.PREM_EXPIRY }}
        CVV: ${{ secrets.PREM_CVV }}

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: Playwright/package-lock.json

        - name: Install Dependencies
          run: npm ci

        - name: Install Playwright Browsers
          run: npx playwright install --with-deps

        - name: Run Playwright Tests
          run: npx playwright test

        - name: Upload Playwright Report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-report
            path: Playwright/playwright-report

        - name: Upload Test Results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: Playwright/test-results


