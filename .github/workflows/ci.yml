name: Final Assessment UI CI

on:
  push:
    branches:
      - capstone-307389-rishika

jobs:
  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui-automation

    env:
      BASE_URL: ${{ secrets.RISHIKA_BASE_URL }}
      CARD_NO: ${{ secrets.RISHIKA_CARD_number }}
      EXPIRY: ${{ secrets.RISHIKA_EXPIRY_date }}
      CVV: ${{ secrets.RISHIKA_CVV }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-automation/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-automation/playwright-report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ui-automation/test-results