name: CI

on:
  push:
    branches:
      - capstone/299166-ManiPrasad
  pull_request:
    branches:
      - capstone/299166-ManiPrasad
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: ${{ secrets.MANI_PRASAD_BASE_URL }}
  BASE_API_URL: ${{ secrets.MANI_PRASAD_BASE_API_URL }}
  USER_NAME: ${{ secrets.MANI_PRASAD_USER_NAME }}
  USER_PASSWORD: ${{ secrets.MANI_PRASAD_USER_PASSWORD }}
  BROWSER: chromium
  HEADLESS: "true"
  TIMEOUT: "30000"
  LOG_LEVEL: info
  CARD_NUMBER: ${{ secrets.MANI_PRASAD_CARD_NUMBER }}
  CARD_EXPIRY: ${{secrets.MANIPRASAD_CARD_EXPIRY}}
  CARD_CVV: ${{secrets.MANIPRASAD_CARD_CVV}}

jobs:

  ui-test:
    name: UI Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Upload Playwright HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright/playwright-report
        retention-days: 30

  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: restAssured

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Run API Tests
        run: mvn --batch-mode test "-Dtest=ListingBooksApiTest"

      - name: Install Allure
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        if: always()
        working-directory: restAssured
        run: |
          allure generate target/allure-results --clean -o allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: restAssured/allure-report