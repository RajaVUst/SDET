name: CI

on:
  push:
    branches:
      - capstone/299166-ManiPrasad
  pull_request:
    branches:
      - capstone/299166-ManiPrasad
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: ${{ secrets.MANI_PRASAD_BASE_URL }}
  BROWSER: chromium
  HEADLESS: "true"
  TIMEOUT: "30000"
  LOG_LEVEL: info
  CARD_NUMBER: ${{ secrets.MANI_PRASAD_CARD_NUMBER }}
  CARD_EXPIRY: ${{secrets.MANIPRASAD_CARD_EXPIRY}}
  CARD_CVV: ${{secrets.MANIPRASAD_CARD_CVV}}

jobs:

  ui-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Upload Playwright HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright/playwright-report
        retention-days: 30