name: CI

on:
  push:
    branches: [main, ragumaan_finalassessment]
  pull_request:
    branches: [main, ragumaan_finalassessment]

jobs:
  restassured:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api_restassured

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22
          cache: maven
          cache-dependency-path: api_restassured/pom.xml

      - name: Run API tests
        run: mvn -B clean test

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: api_restassured/target/site/allure-maven-plugin/
          if-no-files-found: warn

  playwright:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui_playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui_playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui_playwright/playwright-report/
          if-no-files-found: ignore
