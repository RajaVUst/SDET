name: UI + API CI

on:
  push:
    branches:
      - 304525-chandana_finalcapstone
  pull_request:
    branches:
      - 304525-chandana_finalcapstone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-api-tests:
    name: UI and API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
      UI_BASE_URL: ${{ vars.UI_BASE_URL || 'https://chess-agent-83252463.figma.site/' }}
      UI_DEMO_USER_ID: ${{ vars.UI_DEMO_USER_ID || 'demo-login-user-003' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://demoqa.com' }}
      API_USERNAME: ${{ secrets.CHANDANA_API_USERNAME }}
      API_PASSWORD: ${{ secrets.CHANDANA_API_PASSWORD }}
    steps:
      - name: Checkout UI project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: ui

      - name: Checkout API project
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/UI_Final_Capstone/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install UI dependencies
        working-directory: ui/UI_Final_Capstone
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui/UI_Final_Capstone
        run: npx playwright install --with-deps chromium

      - name: Run UI Playwright tests
        working-directory: ui/UI_Final_Capstone
        env:
          BASE_URL: ${{ env.UI_BASE_URL }}
          DEMO_USER_ID: ${{ env.UI_DEMO_USER_ID }}
        run: npm test
        continue-on-error: true

      - name: Run API Maven tests
        working-directory: api/ApiTesting_Final_Capstone
        env:
          BASE_URL: ${{ env.API_BASE_URL }}
          USERNAME: ${{ env.API_USERNAME }}
          PASSWORD: ${{ env.API_PASSWORD }}
        run: mvn -B test
        continue-on-error: true

      - name: Generate API Allure report
        if: always()
        working-directory: api/ApiTesting_Final_Capstone
        run: mvn -B allure:report

      - name: Generate combined Allure report
        if: always()
        run: |
          mkdir -p allure-results-combined
          if [ -d ui/UI_Final_Capstone/allure-results ]; then cp -R ui/UI_Final_Capstone/allure-results/. allure-results-combined/; fi
          if [ -d api/ApiTesting_Final_Capstone/target/allure-results ]; then cp -R api/ApiTesting_Final_Capstone/target/allure-results/. allure-results-combined/; fi
          npm install -g allure-commandline
          allure generate allure-results-combined -o allure-report --clean

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ui/UI_Final_Capstone/playwright-report/
          retention-days: 30

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ui/UI_Final_Capstone/test-results/
          retention-days: 30

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: ui/UI_Final_Capstone/allure-results/
          retention-days: 30

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: api/ApiTesting_Final_Capstone/target/allure-results/
          retention-days: 30

      - name: Upload combined Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: allure-report/
          retention-days: 30
